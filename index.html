<!DOCTYPE html>
<html>
    <head>
        <title>
            Rock Paper Scissors
        </title>
    </head>
    <body>
        <p>Rock Paper Scissors</p>
        <button onclick="
            computerMove = pickComputerMove();
            if (computerMove == 'Rock'){
                score.draw++;
                alert(`You picked Rock, Computer picked ${computerMove}. Tie\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            else if (computerMove == 'Paper'){
                score.lose++;
                alert(`You picked Rock, computer picked ${computerMove}. You lost\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            else {
                score.win++;
                alert(`You picked Rock, computer picked ${computerMove}. You won\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            localStorage.setItem('score', JSON.stringify(score));

        ">Rock</button>
        <button onclick="
            computerMove = pickComputerMove();
            if (computerMove == 'Rock'){
                score.win++;
                alert(`You picked Paper, Computer picked ${computerMove}. You won\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            else if (computerMove == 'Paper'){
                score.draw++;
                alert(`You picked Paper, computer picked ${computerMove}. Tie\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            else {
                score.lose++;
                alert(`You picked Paper, computer picked ${computerMove}. You lost\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            localStorage.setItem('score', JSON.stringify(score));
        ">Paper</button>
        <button onclick="
            computerMove = pickComputerMove();
            if (computerMove == 'Rock'){
                score.lose++;
                alert(`You picked Scissors, Computer picked ${computerMove}. You lost\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            else if (computerMove == 'Paper'){
                score.win++;
                alert(`You picked Scissors, computer picked ${computerMove}. You won\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            else {
                score.draw++;
                alert(`You picked Scissors, computer picked ${computerMove}. Tie\nwin = ${score.win}, lose = ${score.lose}, draw = ${score.draw}`);
            }
            localStorage.setItem('score', JSON.stringify(score));
        ">Scissors</button>
        <button onclick="
            score.win = 0;
            score.lose = 0;
            score.draw = 0;
            alert('win = 0, lose = 0, draw = 0');
            localStorage.setItem('score', JSON.stringify(score));
        ">Reset Score</button>
        <script>
            function pickComputerMove(){
                let computerMove = '';
                const randomNumber = Math.random();
                if (randomNumber <= 1/3){
                    return 'Rock';
                }
                else if (randomNumber <= 2/3){
                    return 'Paper';
                }
                else{
                    return 'Scissors';
                }
            } 
            
            let score = JSON.parse(localStorage.getItem('score'));
            if (score === null){
                score = {
                    win: 0,
                    lose: 0,
                    draw: 0
                }
            }
        </script>
    </body>
</html>
